<!-- ========================= login.html ========================= -->

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Login Admin</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-950 flex items-center justify-center min-h-screen px-4">

<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">

<h2 class="text-3xl font-bold text-center mb-2">
Admin Login
</h2>

<p class="text-center text-gray-500 mb-6">
Syntax Studio 🚀
</p>

<input
id="usuario"
type="text"
placeholder="Usuario"
class="w-full border p-2 mb-4 rounded-lg">

<input
id="password"
type="password"
placeholder="Contraseña"
class="w-full border p-2 mb-4 rounded-lg">

<button
onclick="login()"
class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">

Ingresar

</button>

<p id="mensaje"
class="text-red-500 text-center mt-4"></p>

</div>

<script>

const API = "http://localhost:5000";

async function login() {

  const usuario =
    document.getElementById("usuario").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if (!usuario || !password) {

    document.getElementById("mensaje")
      .innerText = "Completa todos los campos";

    return;
  }

  try {

    const res = await fetch(`${API}/login`, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        usuario,
        password
      })

    });

    const data = await res.json();

    if (res.ok) {

      localStorage.setItem("admin", "true");

      window.location.href = "admin.html";

    } else {

      document.getElementById("mensaje")
        .innerText = data.message;

    }

  } catch (error) {

    document.getElementById("mensaje")
      .innerText = "Error de conexión";

  }

}

</script>

</body>
</html>
